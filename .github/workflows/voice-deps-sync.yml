name: Sync experimental local VAD dependencies

on:
  push:
    branches: [codex/voice-silence-gate-streaming-20261020]
    paths:
      - .github/workflows/voice-deps-sync.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate reproducible lockfile for vendored Silero VAD
        working-directory: apps/kiosk-airi
        run: npm install --save-exact @ricky0123/vad-web@0.0.31 onnxruntime-web@1.22.0 --ignore-scripts
      - name: Commit pinned dependencies and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/kiosk-airi/package.json apps/kiosk-airi/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(voice): lock local neural Silero VAD dependencies'
          git push origin HEAD:codex/voice-silence-gate-streaming-20261020
